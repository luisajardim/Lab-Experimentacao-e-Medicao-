[project]
name = "dora-miner"
version = "0.1.0"
description = "Pipeline de mineração de métricas DORA a partir de repositórios open-source no GitHub (Lab03)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "statsmodels>=0.14,<1",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "pymannkendall>=1.4,<2",
  "lifelines>=0.27,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5.0,<6",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "src/pipeline",
  "src/github",
  "src/cache",
  "src/collector",
  "src/metrics",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
