# Yarn Berry com node-modules (tratamento yarn-berry-nm).
# O `yarnPath` é o que faz o binário global `yarn` 1.22 delegar para o Berry 4.18.1 — por isso
# este arquivo não pode existir em nenhuma pasta ACIMA do projeto (ver projects/README.md).
# Registry e cache ficam fora daqui: o runner (T04, #99) define os dois por variáveis de ambiente.
yarnPath: .yarn/releases/yarn-4.18.1.cjs
nodeLinker: node-modules
# Os outros 5 gerenciadores instalam qualquer versão; o Berry 4.18 recusa as publicadas há
# menos de 24h (npmMinimalAgeGate). Mantido em 0 para que a diferença medida entre os
# tratamentos seja o gerenciador, e não essa checagem (um install que falha não vira medida).
npmMinimalAgeGate: 0
