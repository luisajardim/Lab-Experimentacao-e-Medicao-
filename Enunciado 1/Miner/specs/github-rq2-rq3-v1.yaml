id: "github-rq2-rq3-v1"
version: "1.0.0"
provider: "github-graphql"
description: "Coleta repositórios populares com métricas usadas em RQ02 e RQ03."

graphqlQuery: |
  query GetPopularReposForRQ2RQ3($cursor: String) {
    search(query: "stars:>1 sort:stars-desc", type: REPOSITORY, first: 10, after: $cursor) {
      pageInfo {
        hasNextPage
        endCursor
      }
      nodes {
        ... on Repository {
          nameWithOwner
          createdAt
          pushedAt
          primaryLanguage {
            name
          }
          pullRequests(states: MERGED) {
            totalCount
          }
          releases {
            totalCount
          }
          closedIssues: issues(states: CLOSED) {
            totalCount
          }
          totalIssues: issues {
            totalCount
          }
        }
      }
    }
    rateLimit {
      remaining
      resetAt
    }
  }

extractionRules:
  - metricName: "repositories"
    jsonPath: "$.search.nodes[*]"