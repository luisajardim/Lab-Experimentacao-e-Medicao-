[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-analysis"
version = "0.1.0"
description = "Statistical analysis for LLM productivity experiment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7"
]

[tool.ruff]
target-version = "py310"
line-length = 100