[project]
name = "lab04-testes-hipotese"
version = "0.1.0"
description = "Lab04: testes de hipótese por dentro — Pearson × Spearman com simulação e dashboard."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<3",
  "plotly>=5.24,<7",
  "streamlit>=1.40,<2",
]

[project.scripts]
lab04 = "cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
